<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIVEN 双机透传引擎分发中心</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --error: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.4rem; }
        
        /* 状态框样式 */
        .status-box { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.95rem; font-weight: bold; border: 1px solid transparent; transition: 0.3s; line-height: 1.5; }
        .status-loading { background: #f8f9fa; color: #666; border-color: #ddd; }
        .status-open { background: #e8f8f5; color: var(--success); border-color: #c3e6cb; }
        .status-closed { background: #fdf2f2; color: var(--error); border-color: #f5c6cb; }
        
        input { width: 85%; padding: 12px; border: 2px solid #ecf0f1; border-radius: 8px; margin-bottom: 1rem; font-size: 1rem; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(52, 152, 219, 0.2); }
        input:disabled { background: #ecf0f1; cursor: not-allowed; }
        
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover:not(:disabled) { background: #2980b9; transform: translateY(-1px); }
        button:disabled { background: #95a5a6; cursor: not-allowed; transform: none; }
        
        .download-btn { display: block; text-decoration: none; padding: 12px; margin: 10px 0; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-prog { background: #eef2f5; color: var(--primary); border: 1px solid #dcdde1; }
        .btn-prog:hover { background: #e1e6ea; }
        .btn-key { background: #e8f4fd; color: var(--accent); border: 1px solid #d4e8fc; }
        .btn-key:hover { background: #d0e5f9; }
        
        .hidden { display: none; }
        .footer { margin-top: 1.5rem; font-size: 0.8rem; color: #95a5a6; }
    </style>
</head>
<body>
<div class="card">
    <h2>🚀 透传引擎提取</h2>
    
    <div id="serverRulesBox" class="status-box status-loading">正在获取云端开放规则...</div>

    <div id="statusBox" class="status-box status-loading hidden"></div>

    <div id="inputArea">
        <input type="text" id="orderId" placeholder="请输入你的订单特征码" autocomplete="off" disabled>
        <button id="btnVerify" onclick="verifyOrder()" disabled>验证并提取引擎</button>
    </div>

    <div id="resultArea" class="hidden">
        <a id="linkProg" class="download-btn btn-prog" href="#" download>📦 下载透传引擎本体 (ZIP)</a>
        <a id="linkKey" class="download-btn btn-key" href="#" download>🔑 下载授权密钥文件 (ZIP)</a>
        <button onclick="location.reload()" style="margin-top: 15px; background: #ecf0f1; color: #7f8c8d;">返回重新输入</button>
    </div>

    <div class="footer">EIVEN Passthrough Engine &copy; 2026<br>采用硬件驱动级物理隔离技术</div>
</div>

<script>
    // 1. 网页加载时，立刻去读取当前目录下的 server_status.json
    window.onload = async function() {
        const rulesBox = document.getElementById('serverRulesBox');
        const btnVerify = document.getElementById('btnVerify');
        const orderIdInput = document.getElementById('orderId');

        try {
            // 请求同级目录下的 JSON（增加时间戳防止 Github Pages 强缓存）
            const response = await fetch(`./server_status.json?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error("获取云端规则失败");
            
            const data = await response.json();
            
            // 解析时间判定
            const now = new Date();
            const validFrom = new Date(data.valid_from.replace(/-/g, '/'));
            const validUntil = new Date(data.valid_until.replace(/-/g, '/'));

            // 判断是否在开放期内
            if (data.access_enabled && now >= validFrom && now <= validUntil) {
                rulesBox.className = "status-box status-open";
                rulesBox.innerHTML = `🟢 云端提取通道：开放中<br><span style="font-size: 0.85em; font-weight: normal;">本期时间: ${data.valid_from} 至 ${data.valid_until}</span>`;
                btnVerify.disabled = false;
                orderIdInput.disabled = false;
            } else {
                rulesBox.className = "status-box status-closed";
                rulesBox.innerHTML = `🔴 云端提取通道：已关闭<br><span style="font-size: 0.85em; font-weight: normal;">下期开放: ${data.valid_from} 至 ${data.valid_until}</span>`;
            }
        } catch (e) {
            rulesBox.className = "status-box status-closed";
            rulesBox.innerHTML = "⚠️ 无法获取云端规则，请联系管理员";
        }
    };

    // SHA-256 哈希算法
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 2. 验证订单提取文件逻辑
    async function verifyOrder() {
        const orderId = document.getElementById('orderId').value.trim();
        if (!orderId) { alert("⚠️ 订单特征码不能为空！"); return; }

        const btnVerify = document.getElementById('btnVerify');
        const statusBox = document.getElementById('statusBox');
        const inputArea = document.getElementById('inputArea');
        const resultArea = document.getElementById('resultArea');
        const rulesBox = document.getElementById('serverRulesBox');

        btnVerify.disabled = true;
        btnVerify.textContent = "正在云端进行底层效验...";
        
        // 隐藏规则框，显示进度框
        rulesBox.classList.add('hidden');
        statusBox.classList.remove('hidden');
        statusBox.textContent = "正在连接安全分发网络...";
        statusBox.className = "status-box status-loading";

        try {
            // 严密对齐 Builder 的安全种子
            const salt = "EIVEN_SECURE_2026_SYSTEM_SALT_X9";
            const fullStr = orderId + salt;
            const fullHash = await sha256(fullStr);
            const hashId = fullHash.substring(0, 16).toLowerCase();

            // 相对路径寻址
            const progUrl = `./releases/${hashId}/EIVEN_Program.zip`;
            const keyUrl = `./releases/${hashId}/EIVEN_License.zip`;
            const checkUrl = `${progUrl}?t=${new Date().getTime()}`;

            fetch(checkUrl, { method: 'HEAD' })
                .then(res => {   
                    if (res.ok) {
                        document.getElementById('linkProg').href = progUrl;
                        document.getElementById('linkKey').href = keyUrl;
                        inputArea.classList.add('hidden');
                        statusBox.textContent = "🎉 验证成功，文件已就绪";
                        statusBox.className = "status-box status-open";
                        resultArea.classList.remove('hidden');
                    } else {
                        throw new Error("404");
                    }
                })
                .catch(err => {
                    alert("❌ 验证失败：未找到该订单的专属发行版。\n\n可能原因：\n1. 订单码输入错误\n2. GitHub全球节点正在同步(请等1分钟)\n3. 请尝试 Ctrl+F5 强制刷新");
                    btnVerify.disabled = false;
                    btnVerify.textContent = "验证并提取引擎";
                    rulesBox.classList.remove('hidden');
                    statusBox.classList.add('hidden');
                });
        } catch (e) {
            alert("系统错误: " + e.message);
            btnVerify.disabled = false;
            btnVerify.textContent = "验证并提取引擎";
            rulesBox.classList.remove('hidden');
            statusBox.classList.add('hidden');
        }
    }
    async function probeReleaseFilesPatched(progUrl, keyUrl) {
        const stamp = `?t=${Date.now()}`;
        const [progRes, keyRes] = await Promise.allSettled([
            fetch(progUrl + stamp, { method: 'HEAD', cache: 'no-store' }),
            fetch(keyUrl + stamp, { method: 'HEAD', cache: 'no-store' })
        ]);

        return {
            hasProg: progRes.status === 'fulfilled' && progRes.value.ok,
            hasKey: keyRes.status === 'fulfilled' && keyRes.value.ok
        };
    }

    verifyOrder = async function () {
        const orderId = document.getElementById('orderId').value.trim();
        if (!orderId) {
            alert("Please enter Order ID");
            return;
        }

        const btnVerify = document.getElementById('btnVerify');
        const statusBox = document.getElementById('statusBox');
        const inputArea = document.getElementById('inputArea');
        const resultArea = document.getElementById('resultArea');
        const rulesBox = document.getElementById('serverRulesBox');
        const linkProg = document.getElementById('linkProg');
        const linkKey = document.getElementById('linkKey');

        btnVerify.disabled = true;
        btnVerify.textContent = "Checking...";
        rulesBox.classList.add('hidden');
        statusBox.classList.remove('hidden');
        statusBox.textContent = "Checking release files...";
        statusBox.className = "status-box status-loading";
        resultArea.classList.add('hidden');

        try {
            const salt = "EIVEN_SECURE_2026_SYSTEM_SALT_X9";
            const fullHash = await sha256(orderId + salt);
            const hashId = fullHash.substring(0, 16).toLowerCase();
            const progUrl = `./releases/${hashId}/EIVEN_Program.zip`;
            const keyUrl = `./releases/${hashId}/EIVEN_License.zip`;
            const { hasProg, hasKey } = await probeReleaseFilesPatched(progUrl, keyUrl);

            if (!hasProg && !hasKey) {
                throw new Error('NOT_FOUND');
            }

            linkProg.href = progUrl;
            linkKey.href = keyUrl;
            linkProg.style.display = hasProg ? 'block' : 'none';
            linkKey.style.display = hasKey ? 'block' : 'none';

            inputArea.classList.add('hidden');
            statusBox.textContent = hasProg && hasKey
                ? "Order verified"
                : "Order verified (partial files ready)";
            statusBox.className = "status-box status-open";
            resultArea.classList.remove('hidden');
        } catch (e) {
            alert("Order not found in cloud release.\n\nPossible causes:\n1. Order ID is incorrect\n2. GitHub Pages is still syncing\n3. Try Ctrl+F5 to refresh cache");
            btnVerify.disabled = false;
            btnVerify.textContent = "Verify and Claim";
            rulesBox.classList.remove('hidden');
            statusBox.classList.add('hidden');
        }
    };
</script>
</body>
</html>
