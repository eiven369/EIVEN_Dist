<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EIVEN × Sora1ly</title>
  <style>
    :root{--bg:#07111f;--panel:#101d2e;--line:#263b55;--text:#edf6ff;--muted:#94a9c1;--blue:#45a3ff;--green:#3ddc97;--red:#ff6b78}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#17365b 0,#07111f 55%);font-family:"Microsoft YaHei",system-ui;color:var(--text);padding:24px}
    .card{width:min(560px,100%);background:rgba(16,29,46,.96);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 28px 70px rgba(0,0,0,.4)}
    .title{font-size:28px;margin:0 0 6px}.subtitle{color:var(--blue);font-size:14px;font-weight:700;margin-bottom:20px}
    .status{padding:13px 15px;border-radius:10px;background:#0a1625;border:1px solid var(--line);margin-bottom:18px;color:var(--muted);line-height:1.6}.status-open{border-color:rgba(61,220,151,.55);color:#a9f4d1}.status-wait{border-color:#d4a72c;color:#ffe49a}.status-closed{border-color:rgba(255,107,120,.55);color:#ffc1c7}
    label{display:block;font-size:13px;color:#b7c8da;margin:13px 0 7px}input,textarea{width:100%;border:1px solid var(--line);background:#091522;color:var(--text);border-radius:10px;padding:13px;font-size:15px;outline:none}textarea{min-height:118px;resize:vertical}input:focus,textarea:focus{border-color:var(--blue)}input:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
    button{width:100%;margin-top:20px;border:0;border-radius:11px;padding:14px;background:linear-gradient(135deg,#258cf1,#56b4ff);color:white;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .message{display:none;margin-top:18px;padding:14px;border-radius:10px;line-height:1.65}.ok{display:block;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.45);color:#a9f4d1}.error{display:block;background:rgba(255,107,120,.12);border:1px solid rgba(255,107,120,.45);color:#ffc1c7}
    .downloads{display:grid;gap:10px;margin-top:15px}.download{display:block;padding:13px;border-radius:10px;text-decoration:none;color:var(--text);background:#0a1727;border:1px solid #31547b}
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">EIVEN × Sora1ly</h1>
    <div class="subtitle">ReaSnow S1 配置提取</div>
    <div class="status" id="statusBox">正在读取云端开放时间……</div>
    <label for="orderId">订单号</label>
    <input id="orderId" autocomplete="off" placeholder="请输入订单号">
    <label for="snText">SN码</label>
    <textarea id="snText" placeholder="请输入SN码或粘贴S1 App复制信息"></textarea>
    <button id="extractButton">提取配置</button>
    <div id="message" class="message"></div>
    <div id="downloads" class="downloads"></div>
  </main>
<script>
let portalConfig={};let rules={};
const statusBox=document.getElementById('statusBox');const orderInput=document.getElementById('orderId');const snInput=document.getElementById('snText');const button=document.getElementById('extractButton');const message=document.getElementById('message');const downloads=document.getElementById('downloads');
window.addEventListener('load',async()=>{try{[portalConfig,rules]=await Promise.all([loadJson('portal_config.json'),loadJson('server_status.json')]);document.title=portalConfig.site_title||document.title;renderStatus()}catch(error){setAvailability(false,'⚠️ 无法读取云端开放时间，请稍后重试','status-closed')}});
button.addEventListener('click',extract);
async function extract(){clearResult();const orderId=orderInput.value.trim();const sn=normalizeSn(snInput.value);if(!orderId||!sn){show('\u672a\u627e\u5230\u5bf9\u5e94\u7528\u6237',false);return}button.disabled=true;button.textContent='\u6b63\u5728\u67e5\u8be2\u2026\u2026';try{const releaseToken=await makeReleaseToken(orderId,sn);const ready=await probeRelease(releaseToken);if(!ready.length){show('\u672a\u627e\u5230\u5bf9\u5e94\u7528\u6237',false);return}show('\u9a8c\u8bc1\u901a\u8fc7',true);for(const item of ready){const link=document.createElement('a');link.className='download';link.textContent='\u4e0b\u8f7d '+item.name;link.href=item.url;link.setAttribute('download','');downloads.appendChild(link)}}catch(_error){show('\u63d0\u53d6\u5931\u8d25\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5',false)}finally{button.textContent='\u63d0\u53d6\u914d\u7f6e';renderStatus()}}
async function probeRelease(token){const manifest=await loadJson('release_manifest.json');const results=[];for(const name of manifest.files||[]){const url=`releases/${token}/${encodeURIComponent(name)}`;try{const response=await fetch(url+'?t='+Date.now(),{method:'HEAD',cache:'no-store'});if(response.ok)results.push({name,url})}catch(_error){}}return results}
function normalizeSn(value){const text=String(value||'');const match=text.match(/SN\s*[:\uFF1A]\s*([a-fA-F0-9]{24})/i);const candidate=(match?match[1]:text).replace(/\s+/g,'').toUpperCase();return /^[A-F0-9]{24}$/.test(candidate)?candidate:''}
async function makeReleaseToken(orderId,sn){const snHash=await sha256Hex(sn);return (await sha256Hex(`${orderId}|${snHash}`)).slice(0,24)}
async function sha256Hex(text){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(digest),value=>value.toString(16).padStart(2,'0')).join('')}
function renderStatus(){const from=String(rules.download_valid_from||'').trim();const until=String(rules.download_valid_until||'').trim();const start=Date.parse(from.replace(/-/g,'/'));const end=Date.parse(until.replace(/-/g,'/'));const now=Date.now();if(rules.download_enabled!==true){setAvailability(false,'🔴 云端提取通道：已关闭','status-closed');return}if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start){setAvailability(false,'🔴 云端提取通道：时间配置无效','status-closed');return}if(now<start){setAvailability(false,`🟡 云端提取通道：尚未开放<br><span>开放时间：${from}</span>`,'status-wait');return}if(now>end){setAvailability(false,`🔴 云端提取通道：限时关闭<br><span>本期截止：${until}</span>`,'status-closed');return}setAvailability(true,`🟢 云端提取通道：开放中<br><span>${from} 至 ${until}</span>`,'status-open')}
function setAvailability(open,text,statusClass){statusBox.className='status '+statusClass;statusBox.innerHTML=text;orderInput.disabled=!open;snInput.disabled=!open;button.disabled=!open}
async function loadJson(path){const response=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error(path+' HTTP '+response.status);return response.json()}
function clearResult(){message.className='message';message.textContent='';downloads.innerHTML=''}function show(text,ok){message.className='message '+(ok?'ok':'error');message.textContent=text}
</script>
</body>
</html>
